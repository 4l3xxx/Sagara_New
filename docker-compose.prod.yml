version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sagara_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sagara_revamp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  nlp-service:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    container_name: sagara_nlp
    environment:
      - PORT=5000
    volumes:
      - ./nlp_service/data:/app/data
    restart: always
    # Port NLP tidak di-expose ke luar VPS demi keamanan, Node.js bisa mengaksesnya lewat jaringan internal (http://nlp-service:5000)

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sagara_backend
    ports:
      - "80:3000" # Map Port 80 (HTTP Publik) ke Port 3000 (Internal Node)
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:password123@db:5432/sagara_revamp
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=consulsagara@gmail.com
      - SMTP_PASS=lhzvytchszufhzqi
      - SMTP_FROM=consulsagara@gmail.com
    env_file:
      - .env
    depends_on:
      - db
      - nlp-service
    volumes:
      - ./data:/usr/src/app/data
    restart: always

volumes:
  pgdata:
